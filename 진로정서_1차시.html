<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-name">지금 나의 진로마음 알아보기 · 1차시</span>
      <span class="step-tag" id="progress"></span>
    </div>
  </header>
  <main class="stage" id="stage"></main>
  <div class="footnote">AI 기반 색채 표현을 활용한 진로정서 이해 및 진로성장 프로그램 · 1차시 프로토타입</div>
</div>

<script>
/* =========================================================================
   설정
   ========================================================================= */
const CONFIG = {
  CANVAS_SIZE: 500,
  // 기초연구(대학생 대상)에서 쓰는 한국판 mDES 20문항(이호준·이희경, 2025)의 어휘를 그대로 가져와
  // 진로 맥락에 맞게 10개로 추렸습니다. factor는 향후 데이터 연동 시 참고용(표시하지 않음).
  EMOTION_WORDS: [
    { word: '기대하다', factor: 'positive' },
    { word: '관심있다', factor: 'positive' },
    { word: '기쁘다', factor: 'positive' },
    { word: '자신감', factor: 'positive' },
    { word: '평온하다', factor: 'positive' },
    { word: '당황하다', factor: 'intra' },
    { word: '죄책감', factor: 'intra' },
    { word: '슬프다', factor: 'intra' },
    { word: '두렵다', factor: 'intra' },
    { word: '긴장하다', factor: 'intra' },
  ],
  MAX_EMOTIONS: 3,
  SCENE_EXAMPLES: [
    '내가 무엇을 좋아하는지 모르겠다.',
    '어떤 고등학교를 선택해야 할지 고민된다.',
    '하고 싶은 일이 있지만 내가 잘할 수 있을지 걱정된다.',
    '부모님이 원하는 진로와 내가 원하는 것이 다르다.',
    '진로를 생각하면 그냥 막막하다.',
    '아직 진로에 대해 생각하고 싶지 않다.',
  ],
  // 한국형 진로장벽검사·진로결정자기효능감척도(CDMSES)가 공통으로 다루는 영역(자기명확성·정보·
  // 우유부단성·자신감·중요한 타인과의 갈등·문제해결/실천)을 참고해 6개 범주로 구성했습니다.
  WORRY_CATEGORIES: [
    { id: 'self', label: '자기이해', desc: '내가 무엇을 좋아하고 잘하는지, 어떤 사람인지 아직 잘 모르겠다.' },
    { id: 'info', label: '진로정보', desc: '어떤 진로나 직업이 있는지, 무엇을 준비해야 하는지 정보가 부족하다.' },
    { id: 'choice', label: '선택', desc: '관심 있는 것이 여러 가지라 무엇을 선택해야 할지 결정하기 어렵다.' },
    { id: 'confidence', label: '자신감', desc: '잘 해낼 수 있을지 자신이 없고, 실패할까봐 걱정된다.' },
    { id: 'expectation', label: '주변의 기대', desc: '부모님이나 주변 사람이 원하는 것과 내가 원하는 것이 다르게 느껴진다.' },
    { id: 'action', label: '실천', desc: '무엇부터 시작해야 할지 몰라 행동으로 옮기기 어렵다.' },
  ],
  MAX_WORRIES: 2,
  DEFAULT_COLOR: '#8A8F98',
};
const CS = CONFIG.CANVAS_SIZE;

/* =========================================================================
   상태
   ========================================================================= */
const state = {
  step: 'intro',
  scene: '',
  sceneChoice: null, // 'example' | 'other' | null
  sceneOtherText: '',
  emotions: [],
  shapes: [], nextObjectId: 1, nextOrder: 1, selectedId: null, historyStack: [],
  currentColor: CONFIG.DEFAULT_COLOR, canvasDefaults: null, tone: null,
  canvasImageDataUrl: null,
  aiImageDataUrl: null,
  aiSucceeded: false,
  meaning: { title: '', awareness: '', expression: '', granularity: '', meaning: '', selfNow: '' },
  worries: [],
  profile: { linkedEmotion: '', oneLineSelf: '' },
};

/* =========================================================================
   캔버스 엔진 (연구용 도구와 동일한 방식 — 색상환·형태 배치·부드러운 색면 렌더링)
   ========================================================================= */
let ctx = null;
let canvasKeyHandler = null;
let colorGestureOpen = false;
let sliderGestureOpen = false;

function generateShapePoints(type) {
  if (type === 'ellipse') return null;
  const n = type === 'angular' ? (5 + Math.floor(Math.random() * 3)) : (11 + Math.floor(Math.random() * 4));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 + (Math.random() * 0.15 - 0.075);
    const r = type === 'angular' ? (0.55 + Math.random() * 0.45) : (0.5 + Math.random() * 0.5);
    pts.push({ angle, r });
  }
  return pts;
}
function traceShapePath(c, shape) {
  c.save();
  c.translate(shape.x, shape.y);
  c.rotate(shape.rotation * Math.PI / 180);
  c.beginPath();
  const w = shape.width / 2, h = shape.height / 2;
  if (shape.type === 'ellipse') {
    c.ellipse(0, 0, Math.max(w, 0.01), Math.max(h, 0.01), 0, 0, Math.PI * 2);
  } else if (shape.type === 'angular') {
    shape.points.forEach((p, i) => {
      const px = Math.cos(p.angle) * p.r * w, py = Math.sin(p.angle) * p.r * h;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    });
    c.closePath();
  } else {
    const pts = shape.points.map(p => ({ x: Math.cos(p.angle) * p.r * w, y: Math.sin(p.angle) * p.r * h }));
    const n = pts.length;
    c.moveTo((pts[0].x + pts[n - 1].x) / 2, (pts[0].y + pts[n - 1].y) / 2);
    for (let i = 0; i < n; i++) {
      const cur = pts[i], next = pts[(i + 1) % n];
      c.quadraticCurveTo(cur.x, cur.y, (cur.x + next.x) / 2, (cur.y + next.y) / 2);
    }
    c.closePath();
  }
  c.restore();
}
function renderShapesOnly(c) {
  c.clearRect(0, 0, CS, CS);
  c.fillStyle = '#ffffff';
  c.fillRect(0, 0, CS, CS);
  const sorted = [...state.shapes].sort((a, b) => a.order - b.order);
  sorted.forEach(shape => {
    traceShapePath(c, shape);
    c.save();
    const blurPx = Math.max(3, Math.min(18, Math.min(shape.width, shape.height) * 0.06));
    c.filter = `blur(${blurPx}px)`;
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = shape.colorHex;
    c.globalAlpha = shape.opacity;
    c.fill();
    c.restore();
  });
}
function renderCanvas() {
  if (!ctx) return;
  renderShapesOnly(ctx);
  if (state.selectedId != null) {
    const shape = state.shapes.find(s => s.id === state.selectedId);
    if (shape) {
      ctx.save();
      ctx.translate(shape.x, shape.y);
      ctx.rotate(shape.rotation * Math.PI / 180);
      ctx.strokeStyle = '#45586B';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(-shape.width / 2, -shape.height / 2, shape.width, shape.height);
      ctx.restore();
    }
  }
}
function pushHistory() {
  state.historyStack.push(JSON.parse(JSON.stringify(state.shapes)));
  if (state.historyStack.length > 60) state.historyStack.shift();
}
function undo() {
  if (state.historyStack.length === 0) return;
  state.shapes = state.historyStack.pop();
  state.selectedId = null;
  refreshCanvasUI();
}
function addShape(type) {
  pushHistory();
  const size = (state.canvasDefaults && state.canvasDefaults.size) || 140;
  const jitterRange = (state.canvasDefaults && state.canvasDefaults.jitter) || 30;
  const jitter = () => Math.random() * jitterRange * 2 - jitterRange;
  const shape = {
    id: state.nextObjectId++, order: state.nextOrder++, type,
    x: CS / 2 + jitter(), y: CS / 2 + jitter(), width: size, height: size,
    rotation: 0, opacity: 1, colorHex: state.currentColor, points: generateShapePoints(type),
  };
  state.shapes.push(shape);
  state.selectedId = shape.id;
  refreshCanvasUI();
}
function deleteSelected() {
  if (state.selectedId == null) return;
  pushHistory();
  state.shapes = state.shapes.filter(s => s.id !== state.selectedId);
  state.selectedId = null;
  refreshCanvasUI();
}
function hitTest(mx, my) {
  const sorted = [...state.shapes].sort((a, b) => b.order - a.order);
  for (const shape of sorted) {
    const dx = mx - shape.x, dy = my - shape.y;
    const rad = -shape.rotation * Math.PI / 180;
    const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
    const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
    if (Math.abs(lx) <= shape.width / 2 && Math.abs(ly) <= shape.height / 2) return shape;

}
function hexToRgb(hex) { const m = hex.replace('#', ''); const v = parseInt(m, 16); return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 }; }
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l));
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''); }
function toneBaseColorHex() {

function hueName(deg) {

}

const WHEEL_SIZE = 220, WHEEL_OUTER = 106, WHEEL_INNER = 72;
let HUE_RING_CANVAS = null;
function buildHueRingCanvas() {
  const cvs = document.createElement('canvas'); cvs.width = WHEEL_SIZE; cvs.height = WHEEL_SIZE;
  const c = cvs.getContext('2d');
  const cx = WHEEL_SIZE / 2, cy = WHEEL_SIZE / 2;
  const img = c.createImageData(WHEEL_SIZE, WHEEL_SIZE);
  for (let y = 0; y < WHEEL_SIZE; y++) for (let x = 0; x < WHEEL_SIZE; x++) {
    const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy);
    const idx = (y * WHEEL_SIZE + x) * 4;
    if (r >= WHEEL_INNER && r <= WHEEL_OUTER) {
      let ang = Math.atan2(dy, dx) * 180 / Math.PI; ang = (ang + 360) % 360;
      const [rr, gg, bb] = hslToRgb(ang, 1, 0.5);
      img.data[idx] = rr; img.data[idx + 1] = gg; img.data[idx + 2] = bb; img.data[idx + 3] = 255;
    } else { img.data[idx + 3] = 0; }
  }
  c.putImageData(img, 0, 0);
  return cvs;
}
function angleFromPointer(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const x = e.clientX - rect.left - cx, y = e.clientY - rect.top - cy;
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function redrawWheel(canvas) {
  if (!HUE_RING_CANVAS) HUE_RING_CANVAS = buildHueRingCanvas();
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, WHEEL_SIZE, WHEEL_SIZE);
  c.drawImage(HUE_RING_CANVAS, 0, 0);
  const cx = WHEEL_SIZE / 2, cy = WHEEL_SIZE / 2, rMid = (WHEEL_OUTER + WHEEL_INNER) / 2;
  const rad = state.tone.hue * Math.PI / 180;
  const mx = cx + Math.cos(rad) * rMid, my = cy + Math.sin(rad) * rMid;
  c.beginPath(); c.arc(mx, my, 7, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
  c.lineWidth = 2; c.strokeStyle = '#20232A'; c.stroke();
}

function dataUrlToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function anchorDownload(filename, blobOrUrl) {
  const isBlob = blobOrUrl instanceof Blob;
  const url = isBlob ? URL.createObjectURL(blobOrUrl) : blobOrUrl;
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  if (isBlob) setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function saveViaCapability(filename, data) {
  if (!window.claude || typeof window.claude.use !== 'function') return false;
  let downloads;
  try { downloads = await window.claude.use('downloads'); } catch (e) { return false; }
  if (!downloads) return false;
  try { await downloads.save({ filename, data }); } catch (e) { /* declined or rate-limited: user already saw a prompt, don't fall back */ }
  return true;
}
// 모바일(특히 아이폰)에서는 <a download>로 눌러도 사진 앱/파일에 바로 저장되지 않는 경우가 많아서,
// 가능하면 네이티브 "공유하기" 창(사진에 저장 옵션 포함)을 먼저 띄웁니다. 데스크톱은 보통 이 API를
// 지원하지 않아 자동으로 기존 다운로드 방식으로 넘어갑니다.
async function shareFile(filename, blob, mimeType) {
  if (!navigator.canShare || !navigator.share) return false;
  try {
    const file = new File([blob], filename, { type: mimeType || blob.type || 'application/octet-stream' });
    if (!navigator.canShare({ files: [file] })) return false;
    await navigator.share({ files: [file] });
    return true;
  } catch (e) {
    return true; // 사용자가 공유창에서 취소한 경우도 포함 — 아래 다운로드 방식으로 또 띄우지 않음
  }
}
async function downloadText(filename, content) {
  const handled = await saveViaCapability(filename, content);
  if (handled) return;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  if (await shareFile(filename, blob, 'text/plain')) return;
  anchorDownload(filename, blob);
}
async function downloadDataUrl(filename, srcUrl) {
  let blob;
  if (srcUrl.startsWith('data:')) {
    blob = dataUrlToBlob(srcUrl);
  } else {
    try {
      const resp = await fetch(srcUrl);
      blob = await resp.blob();
    } catch (e) {
      window.open(srcUrl, '_blank'); // 못 받아오면 새 탭에서 열어서 수동 저장하도록
      return;
    }
  }
  const handled = await saveViaCapability(filename, blob);
  if (handled) return;
  if (await shareFile(filename, blob, 'image/png')) return;
  anchorDownload(filename, blob);
}
